# Releases are cut by release-please (https://github.com/googleapis/release-please-action).
# - Every push to main updates a release PR ("chore: release vX.Y.Z") from the Conventional
#   Commit titles merged since the last release: the next version (feat → minor, fix → patch,
#   `!` or BREAKING CHANGE → major), app/package.json and package-lock.json, and app/CHANGELOG.md.
# - Merging that PR tags vX.Y.Z and creates the GitHub release with the changelog as its notes;
#   this run then builds the macOS DMG and the Windows installer and attaches them.
# - Pushing a tag like v0.6.0 by hand builds and attaches installers to that tag's release.
# - Run it by hand (Actions → Release → Run workflow): builds only; download the files from
#   the run's artifacts.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Decides what this run releases: release-please on main, the pushed tag, or nothing (a manual build).
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      publish: ${{ steps.pick.outputs.publish }}
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      - id: release
        if: github.ref == 'refs/heads/main'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: pick
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=$GITHUB_REF_NAME" "publish=true" "ref=$GITHUB_REF" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          elif [[ "$RELEASED" == true ]]; then
            echo "tag=$TAG" "publish=true" "ref=refs/tags/$TAG" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "No release in this push; nothing to build."
            echo "publish=skip" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" "ref=$GITHUB_SHA" | tr ' ' '\n' >> "$GITHUB_OUTPUT"
          fi
        env:
          RELEASED: ${{ steps.release.outputs['app--release_created'] }}
          TAG: ${{ steps.release.outputs['app--tag_name'] }}
      # A tag pushed by hand has no release yet: one, with GitHub's generated notes.
      - name: Create the release for a pushed tag
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  build:
    needs: plan
    if: needs.plan.outputs.publish != 'skip'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon
            target: --mac
          - os: windows-latest
            target: --win
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Typecheck and unit tests
        if: runner.os == 'macOS'
        run: npm run typecheck && npm test

      - name: Build installer
        run: bash scripts/dist.sh ${{ matrix.target }}

      # Only the installers go to the release. The app has no in-app updater, so
      # electron-builder's update files (latest*.yml, .blockmap) are turned off in package.json.
      - name: Upload to the release
        if: needs.plan.outputs.publish == 'true'
        run: |
          shopt -s nullglob
          gh release upload "$TAG" release/*.dmg release/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}

      - uses: actions/upload-artifact@v7
        with:
          name: agent-workspace-${{ runner.os }}
          path: |
            app/release/*.dmg
            app/release/*.exe
          if-no-files-found: error

  # The release keeps release-please's notes (the changelog section); only its title is set here.
  finish:
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Name the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Agent Workspace $TAG" --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
